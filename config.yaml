sumo:
  config_file: sumo_files/test_sumo/test_sumo.sumocfg
  step_length: 1.0
  gui: false
  gridlock_detection_time: 200.0

rl:
  reward_wait_weight: 0.5
  reward_floor: -200.0

  # PPO schedules 
  lr_schedule:
    - [0, 0.0005]        # initial learning rate
    - [400000, 0.00015]  # slightly higher mid-rate for faster early learning
    - [800000, 0.00005]  # lower later for stability

  entropy_coeff_schedule:
    - [0, 0.05]          # encourages exploration early
    - [400000, 0.01]
    - [800000, 0.001]    # stabilize later

  gae_lambda: 0.95

  # Batch sizes
  train_batch_size: 256
  sgd_minibatch_size: 64
  num_sgd_iter: 3

  clip_param: 0.2

  # Network architecture 
  model:
    fcnet_hiddens:
    - 256
    - 256
    fcnet_activation: relu

  # Q-Table params
  qtable:
    gamma: 0.95
    epsilon: 1.0
    epsilon_min: 0.0001
    epsilon_decay: 0.955
    lr: 0.0005
    lr_decay: 0.99
    n_bins: 4
    bin_edges: [-10.0, -0.5, 0.5, 2.0, 10.0]

  # DQN params
  dqn:
    gamma: 0.95
    epsilon: 1.0
    epsilon_min: 0.0001
    epsilon_decay: 0.955
    lr: 0.0005
    lr_decay: 0.99
    batch_size: 128
    buffer_size: 50000
    target_update_freq: 500
    fcnet_hiddens: [256, 256]

traffic:
  yellow_time: 3
  green_time: 42
  durations: [30, 40, 50, 60, 80, 100, 120]
  priority_weights:
    truck: 10.0
    bus: 5.0
    car: 1.0
    motorcycle: 1.0

training:
  federated_rounds: 300   
  local_steps_per_round: 256
  n_clusters: 2
  save_freq: 10
  patience:
    enabled: true
    epochs: 10         
    min_reward_delta: 0.5

evaluation:
  gui: false
  steps: 10000
  step_delay: 0

system:
  server_host: localhost
  server_port: 12345
  max_roads: 7
  controlled_junctions:
  - J1
  - J2
  - J5
  - J7
  model_save_path: saved_models/universal_models
  log_dir: logs
  log_subdirs:
    cfmadrl: cfmadrl
    qtable: qtable
    dqn: dqn
  plot_dir: plots
  silent: true
